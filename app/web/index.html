<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lira Semijoias</title>
<style>
  :root {
    --bg: #fbf8f3; --card: #ffffff; --text: #2b2622; --muted: #8a8076;
    --gold: #b8913f; --gold-dark: #8f6f2c; --line: #e9e1d3; --danger: #b3402f;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #17140f; --card: #211d16; --text: #f1ebe0; --muted: #a79c8c;
      --gold: #d4ad5a; --gold-dark: #e6c27a; --line: #3a3326; --danger: #e0715f;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--text);
    font-family: Georgia, "Times New Roman", serif; line-height: 1.5;
  }
  header { text-align: center; padding: 56px 20px 32px; }
  header h1 {
    margin: 0; font-weight: 400; font-size: 2.6rem; letter-spacing: .18em;
    text-transform: uppercase; color: var(--gold);
  }
  header p { margin: 8px 0 0; color: var(--muted); font-style: italic; }
  main { max-width: 1000px; margin: 0 auto; padding: 0 20px 64px; }
  .bar {
    display: flex; flex-wrap: wrap; gap: 10px; align-items: center;
    justify-content: space-between; margin-bottom: 20px;
  }
  .filters { display: flex; flex-wrap: wrap; gap: 8px; }
  button, input, select { font: inherit; }
  .chip {
    background: transparent; color: var(--text); border: 1px solid var(--line);
    padding: 6px 16px; border-radius: 999px; cursor: pointer;
  }
  .chip.active { background: var(--gold); border-color: var(--gold); color: #fff; }
  .btn {
    background: var(--gold); color: #fff; border: 0; padding: 9px 20px;
    border-radius: 6px; cursor: pointer; letter-spacing: .04em;
  }
  .btn:hover { background: var(--gold-dark); }
  .grid {
    display: grid; gap: 18px;
    grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
  }
  .card {
    background: var(--card); border: 1px solid var(--line); border-radius: 10px;
    padding: 20px; display: flex; flex-direction: column; gap: 6px;
  }
  .card .cat {
    font-size: .75rem; text-transform: uppercase; letter-spacing: .14em;
    color: var(--gold);
  }
  .card h3 { margin: 0; font-weight: 400; font-size: 1.25rem; }
  .card .mat { color: var(--muted); font-size: .92rem; }
  .card .price { font-size: 1.4rem; margin-top: 8px; }
  .card .foot {
    display: flex; justify-content: space-between; align-items: center;
    margin-top: 10px; color: var(--muted); font-size: .88rem;
  }
  .del {
    background: none; border: 0; color: var(--danger); cursor: pointer;
    padding: 0; font-size: .88rem;
  }
  .del:hover { text-decoration: underline; }
  .inativo { opacity: .55; }
  .vazio, .erro { text-align: center; color: var(--muted); padding: 40px 0; }
  .erro { color: var(--danger); }
  dialog {
    border: 1px solid var(--line); border-radius: 12px; background: var(--card);
    color: var(--text); padding: 24px; width: min(420px, 92vw);
  }
  dialog::backdrop { background: rgba(0, 0, 0, .45); }
  dialog h2 { margin: 0 0 14px; font-weight: 400; color: var(--gold); }
  label { display: block; font-size: .85rem; color: var(--muted); margin-top: 10px; }
  input {
    width: 100%; padding: 8px 10px; margin-top: 4px; background: var(--bg);
    color: var(--text); border: 1px solid var(--line); border-radius: 6px;
  }
  .row { display: flex; gap: 10px; }
  .row > div { flex: 1; }
  .actions { display: flex; justify-content: flex-end; gap: 10px; margin-top: 18px; }
  .btn.ghost { background: transparent; color: var(--text); border: 1px solid var(--line); }
  #msg { color: var(--danger); font-size: .88rem; min-height: 1.2em; margin-top: 8px; }
  footer {
    text-align: center; color: var(--muted); font-size: .8rem; padding: 0 20px 40px;
  }
  footer a { color: var(--gold); }
</style>
</head>
<body>
<header>
  <h1>Lira Semijoias</h1>
  <p>Catálogo de produtos</p>
</header>

<main>
  <div class="bar">
    <div class="filters" id="filtros"></div>
    <button class="btn" id="novo">+ Novo produto</button>
  </div>
  <div id="lista" class="grid"></div>
</main>

<footer>
  API REST em Flask &middot;
  <a href="/produtos">/produtos</a> &middot; <a href="/health">/health</a>
</footer>

<dialog id="dlg">
  <h2>Novo produto</h2>
  <form id="form">
    <label>Nome<input name="nome" required></label>
    <div class="row">
      <div><label>Categoria<input name="categoria" placeholder="colar" required></label></div>
      <div><label>Material<input name="material" placeholder="banhado a ouro 18k" required></label></div>
    </div>
    <div class="row">
      <div><label>Preço (R$)<input name="preco" type="number" step="0.01" min="0.01" required></label></div>
      <div><label>Estoque<input name="estoque" type="number" step="1" min="0" required></label></div>
    </div>
    <div id="msg"></div>
    <div class="actions">
      <button type="button" class="btn ghost" id="cancelar">Cancelar</button>
      <button type="submit" class="btn">Salvar</button>
    </div>
  </form>
</dialog>

<script>
  const lista = document.getElementById("lista");
  const filtros = document.getElementById("filtros");
  const dlg = document.getElementById("dlg");
  const form = document.getElementById("form");
  const msg = document.getElementById("msg");
  let categoriaAtual = "";
  let todasCategorias = [];

  const brl = (n) =>
    n.toLocaleString("pt-BR", { style: "currency", currency: "BRL" });

  function el(tag, cls, text) {
    const e = document.createElement(tag);
    if (cls) e.className = cls;
    if (text !== undefined) e.textContent = text;
    return e;
  }

  async function api(url, opts) {
    const r = await fetch(url, opts);
    const data = await r.json();
    if (!r.ok) throw new Error(data.erro || "Erro inesperado.");
    return data;
  }

  function renderFiltros() {
    filtros.replaceChildren();
    ["", ...todasCategorias].forEach((cat) => {
      const b = el("button", "chip" + (cat === categoriaAtual ? " active" : ""),
                   cat ? cat : "Todos");
      b.onclick = () => { categoriaAtual = cat; carregar(); };
      filtros.append(b);
    });
  }

  function renderProdutos(produtos) {
    lista.replaceChildren();
    if (!produtos.length) {
      lista.append(el("div", "vazio", "Nenhum produto encontrado."));
      return;
    }
    produtos.forEach((p) => {
      const card = el("div", "card" + (p.ativo ? "" : " inativo"));
      card.append(
        el("div", "cat", p.categoria),
        el("h3", "", p.nome),
        el("div", "mat", p.material),
        el("div", "price", brl(p.preco))
      );
      const foot = el("div", "foot");
      foot.append(el("span", "", p.estoque + " em estoque"));
      const del = el("button", "del", "Excluir");
      del.onclick = () => excluir(p.id, p.nome);
      foot.append(del);
      card.append(foot);
      lista.append(card);
    });
  }

  async function carregar() {
    try {
      const todos = await api("/produtos");
      todasCategorias = [...new Set(todos.map((p) => p.categoria.toLowerCase()))];
      if (categoriaAtual && !todasCategorias.includes(categoriaAtual)) {
        categoriaAtual = "";
      }
      renderFiltros();
      const url = categoriaAtual
        ? "/produtos?categoria=" + encodeURIComponent(categoriaAtual)
        : "/produtos";
      renderProdutos(await api(url));
    } catch (e) {
      lista.replaceChildren(el("div", "erro", "Não foi possível carregar: " + e.message));
    }
  }

  async function excluir(id, nome) {
    if (!confirm('Excluir "' + nome + '"?')) return;
    try {
      await api("/produtos/" + id, { method: "DELETE" });
      carregar();
    } catch (e) { alert(e.message); }
  }

  document.getElementById("novo").onclick = () => {
    form.reset(); msg.textContent = ""; dlg.showModal();
  };
  document.getElementById("cancelar").onclick = () => dlg.close();

  form.onsubmit = async (ev) => {
    ev.preventDefault();
    const f = new FormData(form);
    const corpo = {
      nome: f.get("nome"),
      categoria: f.get("categoria"),
      material: f.get("material"),
      preco: parseFloat(f.get("preco")),
      estoque: parseInt(f.get("estoque"), 10),
    };
    try {
      await api("/produtos", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(corpo),
      });
      dlg.close();
      carregar();
    } catch (e) { msg.textContent = e.message; }
  };

  carregar();
</script>
</body>
</html>
